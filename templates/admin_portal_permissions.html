<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portal Permissions — Aspidus CRM</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body { font-family: Inter, ui-sans-serif, system-ui, sans-serif; background: linear-gradient(180deg,#f8fafc,#eef2f7); min-height:100vh; }
  .card { background:white; border-radius:14px; border:1px solid #e5e7eb; }
  .btn { padding:6px 12px; border-radius:8px; font-weight:600; font-size:12px; cursor:pointer; }
  .btn-primary { background:linear-gradient(135deg,#4f46e5,#7c3aed); color:white; }
  .btn-ghost { background:white; color:#334155; border:1px solid #e5e7eb; }
  .switch { position:relative; display:inline-block; width:36px; height:20px; }
  .switch input { opacity:0; width:0; height:0; }
  .slider { position:absolute; cursor:pointer; inset:0; background:#cbd5e1; border-radius:99px; transition:.2s; }
  .slider:before { content:''; position:absolute; height:14px; width:14px; left:3px; bottom:3px; background:white; border-radius:50%; transition:.2s; }
  input:checked + .slider { background:linear-gradient(135deg,#4f46e5,#7c3aed); }
  input:checked + .slider:before { transform:translateX(16px); }
</style>
</head>
<body class="p-6 md:p-8">
<div class="max-w-7xl mx-auto">
  <div class="flex items-center justify-between mb-6">
    <div class="flex items-center gap-3">
      <div class="w-11 h-11 rounded-xl bg-gradient-to-br from-indigo-500 to-purple-600 text-white flex items-center justify-center text-xl shadow">🌐</div>
      <div>
        <h1 class="text-2xl font-bold text-slate-900">Portal Permissions</h1>
        <p class="text-xs text-slate-500 mt-0.5">Kontrola šta svaki klijent vidi na svom portalu. Klijent vidi samo dokumente izdate njegovoj firmi.</p>
      </div>
    </div>
    <a href="/" class="btn btn-ghost">← CRM</a>
  </div>

  <div class="grid grid-cols-1 lg:grid-cols-3 gap-4">
    <div class="card p-4 lg:col-span-1">
      <b class="text-slate-900 text-sm uppercase tracking-widest">Partners</b>
      <input id="p-search" placeholder="Search partner…" class="mt-3 w-full text-xs px-3 py-2 border rounded-lg">
      <div id="p-list" class="mt-3 space-y-1 text-sm text-slate-500 max-h-[600px] overflow-y-auto">⏳ Loading…</div>
    </div>
    <div class="card p-5 lg:col-span-2" id="editor">
      <div class="text-slate-400 text-sm text-center py-16">
        Select a partner to configure portal permissions.
      </div>
    </div>
  </div>
</div>

<script>
let csrf='', partners=[], modules={}, selectedId=null;
async function _csrf(){ if(csrf)return csrf; csrf=(await(await fetch('/api/csrf/token')).json()).csrf_token||''; return csrf; }
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}

async function boot() {
  const [m, p] = await Promise.all([
    fetch('/api/admin/portal/modules').then(r=>r.json()),
    fetch('/api/partners').then(r=>r.json()).catch(()=>({partners:[]})),
  ]);
  modules = m.modules || {};
  partners = (p.partners || p || []).filter(x => x && x.id).map(x => ({
    id: x.id, name: x.name || '(unnamed)',
    isPortalActive: x.isPortalActive !== false,
    hasPortalToken: !!x.portalToken,
  }));
  renderList();
}
function renderList() {
  const q = (document.getElementById('p-search').value||'').toLowerCase();
  const f = partners.filter(p => !q || p.name.toLowerCase().includes(q));
  document.getElementById('p-list').innerHTML = f.map(p => `
    <button onclick="pick('${p.id}')" class="w-full text-left px-3 py-2 rounded-lg hover:bg-indigo-50 border ${p.id===selectedId?'border-indigo-400 bg-indigo-50':'border-slate-200'}">
      <div class="flex items-center justify-between gap-2">
        <b class="text-slate-900 truncate text-sm">${esc(p.name)}</b>
        <span class="text-[10px] ${p.isPortalActive?'text-emerald-600':'text-slate-400'}">${p.isPortalActive?'●':'○'} ${p.hasPortalToken?'linked':'no portal'}</span>
      </div>
    </button>
  `).join('') || '<div class="text-slate-400 italic text-xs">No partners.</div>';
}
document.getElementById('p-search').addEventListener('input', renderList);

async function pick(pid) {
  selectedId = pid;
  renderList();
  const r = await fetch('/api/admin/portal/permissions/' + pid);
  const j = await r.json();
  if (!r.ok) { alert(j.error||'Load failed'); return; }
  const enabled = new Set(j.enabled_modules || []);
  const rows = Object.entries(modules).map(([k, desc]) => `
    <label class="flex items-center justify-between py-2 border-b border-slate-100">
      <div class="flex-1">
        <div class="text-sm font-mono text-slate-700">${esc(k)}</div>
        <div class="text-xs text-slate-500">${esc(desc)}</div>
      </div>
      <label class="switch">
        <input type="checkbox" data-mod="${esc(k)}" ${enabled.has(k)?'checked':''}>
        <span class="slider"></span>
      </label>
    </label>
  `).join('');
  document.getElementById('editor').innerHTML = `
    <div class="flex items-center justify-between mb-4">
      <div>
        <b class="text-slate-900 text-base">${esc(j.partner_name)}</b>
        <div class="text-xs text-slate-500 mt-0.5">ID: <code class="bg-slate-100 px-1 rounded">${esc(pid.substring(0,8))}…</code></div>
      </div>
      <button class="btn btn-primary" onclick="save()">💾 Save</button>
    </div>

    <div class="mb-4 space-y-2">
      <label class="flex items-center justify-between py-2 border-y border-slate-200">
        <div>
          <div class="text-sm font-semibold">Portal Active</div>
          <div class="text-xs text-slate-500">Master switch — off = klijent ne može ni na portal</div>
        </div>
        <label class="switch"><input type="checkbox" id="portal-active" ${j.is_portal_active?'checked':''}><span class="slider"></span></label>
      </label>
      <label class="flex items-center justify-between py-2 border-b border-slate-200">
        <div>
          <div class="text-sm font-semibold">Premium Client</div>
          <div class="text-xs text-slate-500">Preskoči KYC-pending gate (klijent vidi sve odmah)</div>
        </div>
        <label class="switch"><input type="checkbox" id="is-premium" ${j.is_premium?'checked':''}><span class="slider"></span></label>
      </label>
      <label class="flex items-center justify-between py-2 border-b border-slate-200">
        <div>
          <div class="text-sm font-semibold">View only own documents</div>
          <div class="text-xs text-slate-500">Klijent vidi samo dokumente izdate njegovoj firmi (preporučeno)</div>
        </div>
        <label class="switch"><input type="checkbox" id="view-own" ${j.view_only_own_docs?'checked':''}><span class="slider"></span></label>
      </label>
    </div>

    <b class="text-xs uppercase tracking-widest text-slate-600">Enabled Modules</b>
    ${rows}
  `;
}
async function save() {
  const enabled = [];
  document.querySelectorAll('[data-mod]').forEach(c => { if (c.checked) enabled.push(c.dataset.mod); });
  const payload = {
    enabled_modules: enabled,
    is_portal_active: document.getElementById('portal-active').checked,
    is_premium: document.getElementById('is-premium').checked,
    view_only_own_docs: document.getElementById('view-own').checked,
  };
  const csrfTok = await _csrf();
  const r = await fetch('/api/admin/portal/permissions/' + selectedId, {
    method:'POST', headers:{'Content-Type':'application/json','X-CSRF-Token':csrfTok},
    body: JSON.stringify(payload)
  });
  const j = await r.json();
  if (r.ok) alert('✓ Saved.');
  else alert('✗ ' + (j.error || r.status));
}
boot();
</script>
</body>
</html>
