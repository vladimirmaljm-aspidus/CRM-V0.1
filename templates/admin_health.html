<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>System Health — Aspidus CRM</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: Inter, ui-sans-serif, system-ui, -apple-system, sans-serif; background: linear-gradient(180deg,#f8fafc,#eef2f7); min-height:100vh; }
        .card { background:white; border-radius:14px; border:1px solid #e5e7eb; padding:18px 20px; transition: all .2s; }
        .card.ok { border-left: 4px solid #10b981; }
        .card.warn { border-left: 4px solid #f59e0b; }
        .card.err { border-left: 4px solid #ef4444; }
        .card.disabled { border-left: 4px solid #94a3b8; opacity: .7; }
        .btn { padding:9px 18px; border-radius:10px; font-weight:600; font-size:13px; transition:all .15s; display:inline-flex; align-items:center; gap:8px; }
        .btn-ghost { background:white; color:#334155; border:1px solid #e5e7eb; }
        .btn-ghost:hover { background:#f8fafc; }
        .btn-primary { background:linear-gradient(135deg,#4f46e5,#7c3aed); color:white; }
        .header-icon { width:38px; height:38px; border-radius:10px; background:linear-gradient(135deg,#10b981,#059669); color:white; display:inline-flex; align-items:center; justify-content:center; font-size:18px; box-shadow:0 4px 10px rgba(16,185,129,.3); }
        .status-badge { padding:4px 12px; border-radius:999px; font-size:10px; font-weight:700; letter-spacing:.05em; text-transform:uppercase; }
        .status-ok { background:#dcfce7; color:#166534; }
        .status-warn { background:#fef3c7; color:#92400e; }
        .status-err { background:#fee2e2; color:#991b1b; }
        .status-disabled { background:#f1f5f9; color:#64748b; }
        .service-icon { width:44px; height:44px; border-radius:12px; display:inline-flex; align-items:center; justify-content:center; font-size:20px; flex-shrink:0; }
        .service-icon.auth   { background:linear-gradient(135deg,#4f46e5,#7c3aed); color:white; }
        .service-icon.db     { background:linear-gradient(135deg,#0ea5e9,#0284c7); color:white; }
        .service-icon.storage { background:linear-gradient(135deg,#f59e0b,#d97706); color:white; }
        .service-icon.smtp   { background:linear-gradient(135deg,#ef4444,#dc2626); color:white; }
        .service-icon.sqlite { background:linear-gradient(135deg,#10b981,#059669); color:white; }
        .service-icon.backup { background:linear-gradient(135deg,#8b5cf6,#7c3aed); color:white; }
        .service-icon.disk   { background:linear-gradient(135deg,#64748b,#475569); color:white; }
        pre.detail { background:#f8fafc; border:1px solid #e2e8f0; padding:10px 12px; border-radius:8px; font-size:11px; line-height:1.5; color:#334155; margin-top:10px; overflow-x:auto; font-family: ui-monospace, monospace; }
        .pulse { animation: pulse 2s ease-in-out infinite; }
        @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.5} }
    </style>
</head>
<body class="p-6 md:p-8">
    <div class="max-w-5xl mx-auto">
        <div class="flex items-center justify-between mb-6">
            <div class="flex items-center gap-4">
                <span class="header-icon">💚</span>
                <div>
                    <h1 class="text-2xl font-bold text-slate-900">System Health</h1>
                    <p class="text-sm text-slate-500 mt-0.5">Live probe svih spoljnih servisa. Auto-refresh svakih 15 sekundi.</p>
                </div>
            </div>
            <div class="flex items-center gap-2">
                <button class="btn btn-ghost" onclick="refresh()">🔄 Refresh Now</button>
                <a href="/admin/supabase" class="btn btn-ghost">← Supabase Admin</a>
                <a href="/" class="btn btn-ghost">← CRM</a>
            </div>
        </div>

        <div id="overall" class="mb-4"></div>
        <div id="services" class="grid grid-cols-1 md:grid-cols-2 gap-3"></div>
        <div id="circuits" class="mt-6"></div>
        <div class="text-xs text-slate-400 text-center mt-6">
            Last check: <span id="ts">—</span>
        </div>
    </div>

    <script>
        const SERVICES = {
            sqlite:           { icon:'💾', name:'SQLite Local DB',      cls:'sqlite',  desc:'Lokalne baze — CRM, Portal, Audit.' },
            supabase_auth:    { icon:'🔐', name:'Supabase Auth',        cls:'auth',    desc:'Autentifikacija klijenata portala.' },
            supabase_db:      { icon:'☁️', name:'Supabase Postgres',    cls:'db',      desc:'Cloud baza podataka partnera.' },
            supabase_storage: { icon:'📦', name:'Supabase Storage',     cls:'storage', desc:'Cloud fajl storage (dokumenti, PDF-ovi).' },
            smtp:             { icon:'✉️', name:'SMTP Email Server',    cls:'smtp',    desc:'Slanje mejlova (invite, reset, notif).' },
            backup:           { icon:'🗄', name:'Fernet Backup System', cls:'backup',  desc:'Dnevni šifrovani snapshot baza.' },
            disk:             { icon:'💽', name:'Disk Space',           cls:'disk',    desc:'Slobodan prostor na PA serveru.' },
        };

        async function refresh() {
            document.getElementById('services').innerHTML = '<div class="col-span-2 text-center text-slate-400 py-8 pulse">⏳ Probing services...</div>';
            try {
                const r = await fetch('/api/admin/health');
                const j = await r.json();
                render(j);
            } catch (e) {
                document.getElementById('services').innerHTML = '<div class="col-span-2 text-red-600 text-sm">Error loading health: ' + e.message + '</div>';
            }
        }

        function statusClass(check) {
            if (check.status === 'disabled' || check.status === 'not_configured') return 'disabled';
            if (check.ok) return 'ok';
            if (check.status === 'circuit_open' || check.status === 'stale' || check.status === 'low_space') return 'warn';
            return 'err';
        }

        function statusLabel(check) {
            const cls = statusClass(check);
            if (cls === 'ok') return 'OK';
            if (cls === 'disabled') return 'Disabled';
            if (cls === 'warn') return 'Warning';
            return 'ERROR';
        }

        function render(j) {
            const overallDiv = document.getElementById('overall');
            const allOk = j.ok;
            overallDiv.innerHTML = allOk
                ? `<div class="card ok"><div class="flex items-center justify-between"><div><b class="text-emerald-700">✓ Svi servisi rade</b><p class="text-xs text-slate-500 mt-1">Portal spreman za produkciju.</p></div><span class="status-badge status-ok">HEALTHY</span></div></div>`
                : `<div class="card err"><div class="flex items-center justify-between"><div><b class="text-red-700">⚠ Neki servisi imaju problem</b><p class="text-xs text-slate-500 mt-1">Pogledaj detalje ispod.</p></div><span class="status-badge status-err">DEGRADED</span></div></div>`;

            let html = '';
            for (const [key, meta] of Object.entries(SERVICES)) {
                const c = (j.checks || {})[key] || {ok:false, status:'unknown'};
                const cls = statusClass(c);
                const label = statusLabel(c);
                let detailStr = '';
                if (c.detail) {
                    detailStr = typeof c.detail === 'object'
                        ? JSON.stringify(c.detail, null, 2)
                        : String(c.detail);
                }
                html += `<div class="card ${cls}">
                    <div class="flex items-start gap-4">
                        <div class="service-icon ${meta.cls}">${meta.icon}</div>
                        <div class="flex-1 min-w-0">
                            <div class="flex items-center justify-between gap-2">
                                <b class="text-slate-900">${meta.name}</b>
                                <span class="status-badge status-${cls}">${label}</span>
                            </div>
                            <p class="text-xs text-slate-500 mt-1">${meta.desc}</p>
                            ${detailStr ? '<pre class="detail">' + escHtml(detailStr) + '</pre>' : ''}
                        </div>
                    </div>
                </div>`;
            }
            document.getElementById('services').innerHTML = html;

            const cir = j.circuits || [];
            if (cir.length) {
                let ch = '<div class="card"><b class="text-slate-900">Circuit Breakers</b><p class="text-xs text-slate-500 mt-1">Stanje graceful-degradation prekidača za spoljne servise.</p><div class="mt-3 space-y-2">';
                for (const c of cir) {
                    const badge = c.state === 'closed' ? 'status-ok' : c.state === 'open' ? 'status-err' : 'status-warn';
                    ch += `<div class="flex items-center justify-between text-sm py-2 border-b border-slate-100">
                        <span class="font-mono text-slate-700">${escHtml(c.name)}</span>
                        <div class="flex items-center gap-3">
                            <span class="text-xs text-slate-500">failures: ${c.failures}</span>
                            ${c.will_retry_in ? '<span class="text-xs text-amber-600">retry in ' + Math.round(c.will_retry_in) + 's</span>' : ''}
                            <span class="status-badge ${badge}">${c.state}</span>
                        </div>
                    </div>`;
                }
                ch += '</div></div>';
                document.getElementById('circuits').innerHTML = ch;
            } else {
                document.getElementById('circuits').innerHTML = '';
            }

            document.getElementById('ts').textContent = j.timestamp || new Date().toISOString();
        }

        function escHtml(s) { return String(s || '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }

        refresh();
        setInterval(refresh, 15000);
    </script>
</body>
</html>
