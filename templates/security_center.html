<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Security Center — Aspidus CRM</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body { font-family: Inter, ui-sans-serif, system-ui, sans-serif; background: linear-gradient(180deg,#f8fafc,#eef2f7); min-height:100vh; }
  .card { background:white; border-radius:14px; border:1px solid #e5e7eb; padding:18px 20px; }
  .tab { padding:8px 14px; font-size:13px; font-weight:600; color:#475569; border-radius:10px; cursor:pointer; transition:.15s; }
  .tab.active { background:linear-gradient(135deg,#4f46e5,#7c3aed); color:white; }
  .btn { padding:6px 12px; border-radius:8px; font-weight:600; font-size:12px; transition:.15s; cursor:pointer; }
  .btn-danger { background:#fee2e2; color:#dc2626; border:1px solid #fecaca; }
  .btn-danger:hover { background:#fecaca; }
  .btn-primary { background:linear-gradient(135deg,#4f46e5,#7c3aed); color:white; }
  .btn-ghost { background:white; color:#334155; border:1px solid #e5e7eb; }
  .badge { display:inline-block; padding:2px 8px; border-radius:99px; font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.05em; }
  .badge-green { background:#dcfce7; color:#166534; }
  .badge-red { background:#fee2e2; color:#991b1b; }
  .badge-amber { background:#fef3c7; color:#92400e; }
  .badge-blue { background:#dbeafe; color:#1e40af; }
  input, select { padding:8px 12px; border:1px solid #e2e8f0; border-radius:8px; width:100%; font-size:13px; }
  input:focus, select:focus { outline:none; border-color:#4f46e5; box-shadow:0 0 0 3px rgba(79,70,229,.15); }
</style>
</head>
<body class="p-6 md:p-8">
<div class="max-w-5xl mx-auto">
  <div class="flex items-center justify-between mb-6">
    <div class="flex items-center gap-3">
      <div class="w-11 h-11 rounded-xl bg-gradient-to-br from-indigo-500 to-purple-600 text-white flex items-center justify-center text-xl shadow">🔐</div>
      <div>
        <h1 class="text-2xl font-bold text-slate-900">Security Center</h1>
        <p class="text-xs text-slate-500 mt-0.5">Sessions, devices, login history, and account security.</p>
      </div>
    </div>
    <a href="/" class="btn btn-ghost">← Back to CRM</a>
  </div>

  <div class="flex gap-2 mb-4 flex-wrap">
    <button class="tab active" data-tab="sessions">Active Sessions</button>
    <button class="tab" data-tab="devices">Trusted Devices</button>
    <button class="tab" data-tab="history">Login History</button>
    <button class="tab" data-tab="ips">Known IPs</button>
    <button class="tab" data-tab="password">Password</button>
  </div>

  <div id="tab-content" class="card">
    <div class="text-slate-400 text-center py-12 text-sm">⏳ Loading…</div>
  </div>
</div>

<script>
let csrf = '';
async function _csrf() {
  if (csrf) return csrf;
  const r = await fetch('/api/csrf/token'); csrf = (await r.json()).csrf_token || '';
  return csrf;
}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
function ago(iso){ if(!iso)return '—'; const s=Math.floor((Date.now()-new Date(iso).getTime())/1000); if(s<60)return s+'s ago'; if(s<3600)return Math.floor(s/60)+'m ago'; if(s<86400)return Math.floor(s/3600)+'h ago'; return Math.floor(s/86400)+'d ago'; }

const div = document.getElementById('tab-content');

document.querySelectorAll('.tab').forEach(t => {
  t.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
    t.classList.add('active');
    render(t.dataset.tab);
  });
});

async function render(tab) {
  div.innerHTML = '<div class="text-slate-400 text-center py-12 text-sm">⏳ Loading…</div>';
  if (tab === 'sessions')  return renderSessions();
  if (tab === 'devices')   return renderDevices();
  if (tab === 'history')   return renderHistory();
  if (tab === 'ips')       return renderIps();
  if (tab === 'password')  return renderPassword();
}

async function renderSessions() {
  const r = await fetch('/api/security/sessions');
  const j = await r.json();
  const rows = j.sessions || [];
  div.innerHTML = `
    <div class="mb-3 flex items-center justify-between">
      <b class="text-sm">Active Sessions (${rows.length})</b>
      <button class="btn btn-danger" onclick="killAllOthers()">Terminate all other sessions</button>
    </div>
    ${rows.length===0 ? '<div class="text-slate-400 italic text-sm text-center py-6">No sessions.</div>' :
      '<div class="space-y-2">' + rows.map(s => `
        <div class="flex items-center justify-between p-3 rounded-lg border ${s.is_current?'border-emerald-300 bg-emerald-50/40':'border-slate-200'} ${s.revoked?'opacity-50':''}">
          <div>
            <div class="text-sm font-semibold">
              ${esc(s.device || 'Unknown device')}
              ${s.is_current?'<span class="badge badge-green ml-2">This device</span>':''}
              ${s.revoked?'<span class="badge badge-red ml-2">Revoked</span>':''}
            </div>
            <div class="text-xs text-slate-500 mt-0.5">
              ${esc(s.ip||'?')} · ${esc(s.country||'?')} · Last seen ${ago(s.last_seen_at)}
            </div>
          </div>
          ${(!s.revoked && !s.is_current) ? `<button class="btn btn-danger" onclick="revokeSess('${s.id}')">Terminate</button>` : ''}
        </div>
      `).join('') + '</div>'
    }
  `;
}

async function revokeSess(sid) {
  if (!confirm('Terminate this session?')) return;
  const csrfTok = await _csrf();
  await fetch(`/api/security/sessions/${sid}/revoke`, {method:'POST', headers:{'X-CSRF-Token':csrfTok}});
  renderSessions();
}

async function killAllOthers() {
  if (!confirm('Sign out all OTHER devices? Your current session stays active.')) return;
  const csrfTok = await _csrf();
  await fetch('/api/auth/logout_all', {method:'POST', headers:{'X-CSRF-Token':csrfTok,'Content-Type':'application/json'}, body:'{}'});
  alert('All other sessions terminated. You will need to sign in again on other devices.');
  renderSessions();
}

async function renderDevices() {
  const r = await fetch('/api/security/trusted-devices');
  const j = await r.json();
  const rows = j.devices || [];
  div.innerHTML = `
    <b class="text-sm">Trusted Devices — skip 2FA re-prompt for 30 days</b>
    <div class="text-xs text-slate-500 mb-3 mt-1">When you complete 2FA on a device, you can mark it as trusted so you won't be asked again for 30 days from that device.</div>
    ${rows.length===0 ? '<div class="text-slate-400 italic text-sm text-center py-6">No trusted devices.</div>' :
      '<div class="space-y-2">' + rows.map(d => `
        <div class="flex items-center justify-between p-3 rounded-lg border ${d.revoked?'border-slate-200 opacity-50':'border-slate-200'}">
          <div>
            <div class="text-sm font-semibold">${esc(d.label || 'Device')} ${d.revoked?'<span class="badge badge-red ml-2">Revoked</span>':''}</div>
            <div class="text-xs text-slate-500 mt-0.5">Last IP ${esc(d.last_ip||'?')} · Last seen ${ago(d.last_seen_at)} · Expires ${esc((d.expires_at||'').substring(0,10))}</div>
          </div>
          ${!d.revoked?`<button class="btn btn-danger" onclick="revokeDev('${d.id}')">Revoke</button>`:''}
        </div>
      `).join('') + '</div>'
    }
  `;
}

async function revokeDev(did) {
  const csrfTok = await _csrf();
  await fetch(`/api/security/trusted-devices/${did}/revoke`, {method:'POST', headers:{'X-CSRF-Token':csrfTok}});
  renderDevices();
}

async function renderHistory() {
  const r = await fetch('/api/security/login-history');
  const j = await r.json();
  const rows = j.events || [];
  div.innerHTML = `
    <b class="text-sm">Login History (last 100 events)</b>
    <div class="mt-3 space-y-1 max-h-[500px] overflow-y-auto">
      ${rows.length===0?'<div class="text-slate-400 italic text-sm text-center py-6">No events.</div>':
        rows.map(e => `
          <div class="p-2 rounded-lg border border-slate-100 text-xs flex items-center gap-3">
            <span class="badge ${e.action==='LOGIN'?'badge-green':(e.action==='SECURITY'?'badge-red':'badge-blue')}">${esc(e.action)}</span>
            <span class="text-slate-500 whitespace-nowrap">${esc((e.timestamp||'').replace('T',' ').substring(0,19))}</span>
            <span class="text-slate-700 flex-1 truncate">${esc(e.details||'')}</span>
            <span class="text-slate-400 whitespace-nowrap">${esc(e.ip||'')}</span>
          </div>
        `).join('')
      }
    </div>
  `;
}

async function renderIps() {
  const r = await fetch('/api/security/known-ips');
  const j = await r.json();
  const rows = j.ips || [];
  div.innerHTML = `
    <b class="text-sm">Known IPs — Aspidus recognizes these</b>
    <div class="text-xs text-slate-500 mb-3 mt-1">When you sign in from an IP not on this list, you'll get an email alert. Forget an IP to reset that tracking.</div>
    ${rows.length===0?'<div class="text-slate-400 italic text-sm text-center py-6">No known IPs recorded yet.</div>':
      '<div class="space-y-2">'+rows.map(ip => `
        <div class="flex items-center justify-between p-3 rounded-lg border border-slate-200">
          <div>
            <div class="text-sm font-semibold">${esc(ip.ip)}</div>
            <div class="text-xs text-slate-500">${esc(ip.city||'?')}, ${esc(ip.country||'?')} · ${ip.login_count} sign-ins · Last ${ago(ip.last_seen)}</div>
          </div>
          <button class="btn btn-ghost" onclick="forgetIp('${ip.id}')">Forget</button>
        </div>
      `).join('')+'</div>'
    }
  `;
}

async function forgetIp(kid) {
  if (!confirm('Forget this IP? Next sign-in from it will trigger a new-location alert.')) return;
  const csrfTok = await _csrf();
  await fetch(`/api/security/known-ips/${kid}/forget`, {method:'POST', headers:{'X-CSRF-Token':csrfTok}});
  renderIps();
}

async function renderPassword() {
  const p = await (await fetch('/api/security/password/policy')).json();
  div.innerHTML = `
    <b class="text-sm">Change Password</b>
    <div class="text-xs text-slate-500 mt-1 mb-4">
      Minimum ${p.password_min_length} characters, must include uppercase + lowercase + digit + special char.
      Last ${p.password_history_count} passwords cannot be reused.
      ${p.password_max_age_days > 0 ? `Password expires every ${p.password_max_age_days} days.` : ''}
    </div>
    <form onsubmit="return changePw(event)" class="space-y-3 max-w-md">
      <div>
        <label class="text-xs font-semibold text-slate-600 block mb-1">New password</label>
        <input type="password" id="np1" required minlength="${p.password_min_length}" autocomplete="new-password">
      </div>
      <div>
        <label class="text-xs font-semibold text-slate-600 block mb-1">Confirm new password</label>
        <input type="password" id="np2" required autocomplete="new-password">
      </div>
      <button type="submit" class="btn btn-primary">Change password</button>
    </form>
    <div id="pw-msg" class="mt-3 text-xs"></div>
  `;
}

async function changePw(e) {
  e.preventDefault();
  const p1 = document.getElementById('np1').value;
  const p2 = document.getElementById('np2').value;
  const msg = document.getElementById('pw-msg');
  msg.className = 'mt-3 text-xs';
  if (p1 !== p2) { msg.textContent = '✗ Passwords do not match.'; msg.classList.add('text-red-600'); return false; }
  const csrfTok = await _csrf();
  const r = await fetch('/api/auth/change_password', {
    method:'POST', headers:{'Content-Type':'application/json','X-CSRF-Token':csrfTok},
    body: JSON.stringify({ new_password: p1 })
  });
  const j = await r.json();
  if (r.ok) {
    msg.textContent = '✓ Password changed. You will be signed out. Redirecting…';
    msg.classList.add('text-emerald-600');
    setTimeout(() => location.href = '/', 2000);
  } else {
    msg.textContent = '✗ ' + (j.message || j.error || r.status);
    msg.classList.add('text-red-600');
  }
  return false;
}

renderSessions();
</script>
</body>
</html>
