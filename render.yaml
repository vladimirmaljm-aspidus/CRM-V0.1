services:
  - type: web
    name: aspidus-crm
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 2 --timeout 120 --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.6"
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: DATA_DIR
        value: /opt/render/project/src/data
      - key: FLASK_ENV
        value: production
    disk:
      name: aspidus-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
